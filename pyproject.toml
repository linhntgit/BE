[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "be-analysis-workbench"
version = "0.3.1"
description = "Vietnamese internal bioequivalence analysis workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "scipy==1.15.3", "streamlit==1.66.1", "pillow>=13,<14",
  "plotly>=6,<7", "openpyxl>=3.1,<4", "python-docx>=1.1,<2",
  "reportlab>=4,<6", "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.14", "mypy>=1.18", "pip-audit>=2.9", "filelock>=4.2.1", "statsmodels==0.14.6", "PyMuPDF>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["be_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".cache", ".venv", ".venv-clean", "output", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"be_app/design.py" = ["S311"]
"be_app/examples.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", ".cache"]

